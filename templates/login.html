{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="narrow">
  <h1 class="h3">Student login</h1>
  <form method="post" class="needs-validation card-panel" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
      <div class="invalid-feedback">Enter your email address.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
      <div class="invalid-feedback">Enter your password.</div>
    </div>
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 text-center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
